[project]
name = "analyticsgear-sales-pipeline"
version = "0.1.0"
description = "Simple AI sales pipeline — scores leads and drafts personalized emails"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AnalyticsGear" }]

# Deliberately minimal. One Claude call does the work — no vector DB, no MCP,
# no agent framework. Add deps only when a phase genuinely needs them.
dependencies = [
    "anthropic>=0.40.0",     # the brain: scores + drafts emails
    "python-dotenv>=1.0.0",  # load API keys from .env
]

[project.optional-dependencies]
# Added in later phases:
#   sending  -> Phase 3 (automated email)
#   sheets   -> if you switch CRM from SQLite to Google Sheets
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
sending = [
    "sendgrid>=6.11.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
